<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2C Verified Outreach | Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        :root { --brand-primary: #0f172a; --brand-accent: #6366f1; --bg-main: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: #1e293b; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 1); border-radius: 1.25rem; }
        .input-pill { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1.5px solid #e2e8f0; font-size: 0.875rem; transition: all 0.2s; background: white; }
        .input-pill:focus { outline: none; border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .btn-action { background: var(--brand-primary); color: white; padding: 0.85rem 1.5rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-action:hover { background: #000; transform: translateY(-1px); }
        .score-circle { position: relative; width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; background: radial-gradient(closest-side, white 80%, transparent 81% 100%), conic-gradient(#6366f1 0%, #e2e8f0 0); transition: background 0.5s ease; }
        .tab-btn { flex: 1; padding: 0.75rem; font-size: 0.75rem; font-weight: 700; border-radius: 0.5rem; transition: all 0.2s; color: #64748b; }
        .tab-active { background: #0f172a; color: white; }
        .chart-container { position: relative; width: 100%; height: 160px; }
        .loading-dots { display: inline-flex; gap: 2px; }
        .loading-dots div { width: 4px; height: 4px; background: currentColor; border-radius: 50%; animation: blink 1.4s infinite both; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-xl">V</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">C2C Verified<span class="text-indigo-600">Outreach</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest leading-none">Intelligence Suite</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleSettings()" class="p-2 hover:bg-slate-100 rounded-full text-slate-400">⚙️ Settings</button>
                <div class="bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm flex items-center gap-2 text-[10px] font-bold text-slate-500 uppercase">
                    <span id="apiStatusDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span id="apiStatusText">AI: Offline</span>
                </div>
            </div>
        </header>

        <!-- API Settings -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
                <h3 class="text-lg font-bold mb-2">Service Settings</h3>
                <p class="text-sm text-slate-500 mb-6">Enter your Gemini API key to enable AI features.</p>
                <input type="password" id="apiKeyInput" class="input-pill mb-4" placeholder="Gemini API Key">
                <div class="flex gap-3">
                    <button onclick="saveApiKey()" class="btn-action flex-1">Save Key</button>
                    <button onclick="toggleSettings()" class="flex-1 font-bold text-slate-400">Cancel</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <aside class="lg:col-span-3 space-y-6">
                <div class="glass-panel p-6 border-t-4 border-indigo-500 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Email Discovery</h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="firstName" class="input-pill text-xs" placeholder="First">
                            <input type="text" id="lastName" class="input-pill text-xs" placeholder="Last">
                        </div>
                        <input type="text" id="domain" class="input-pill text-xs" placeholder="Domain (google.com)">
                        <div class="flex gap-2">
                            <button onclick="predictEmails()" class="btn-action flex-1 py-2 text-xs">Predict</button>
                            <button onclick="auditDomain()" class="bg-slate-100 px-3 rounded-lg text-slate-500 hover:text-indigo-600 transition-colors">⚖️</button>
                        </div>
                        <div id="emailResults" class="hidden space-y-2 mt-4 max-h-48 overflow-y-auto pr-1"></div>
                    </div>
                </div>
                <div class="glass-panel p-6">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Workspace</h3>
                    <div class="space-y-4">
                        <input type="text" id="roleInput" class="input-pill text-xs" placeholder="Target Role">
                        <input type="text" id="stackInput" class="input-pill text-xs" placeholder="Tech Highlights">
                        <button onclick="generate()" class="btn-action w-full text-xs">Build Sequence</button>
                    </div>
                </div>
            </aside>

            <main class="lg:col-span-6 space-y-6">
                <div class="glass-panel overflow-hidden border-2 border-slate-900 shadow-2xl">
                    <nav class="flex bg-slate-900 p-1">
                        <button onclick="tab('step1')" id="t1" class="tab-btn tab-active">1. PERMISSION CHECK</button>
                        <button onclick="tab('step2')" id="t2" class="tab-btn">2. PITCH FOLLOW-UP</button>
                    </nav>
                    <div class="p-8">
                        <div id="step1View" class="space-y-6">
                            <div class="flex justify-between items-center"><h2 class="text-xl font-bold">Initial Query</h2><button onclick="copy('msg1')" class="text-xs font-bold text-indigo-600">Copy Body</button></div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Subject</label>
                                <input type="text" id="sub1" readonly class="bg-transparent text-sm font-bold text-slate-800 w-full focus:outline-none" value="---">
                            </div>
                            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 min-h-[160px] relative">
                                <p id="msg1" class="text-sm text-slate-600 leading-relaxed italic">Generating...</p>
                                <button onclick="humanize()" class="absolute bottom-4 right-4 bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg hover:bg-indigo-700 flex items-center gap-2">✨ Humanize <div id="aiLoad" class="hidden"><div class="loading-dots"><div></div><div></div><div></div></div></div></button>
                            </div>
                        </div>
                        <div id="step2View" class="space-y-6 hidden">
                            <div class="flex justify-between items-center"><h2 class="text-xl font-bold">Submission Follow-up</h2><button onclick="copy('msg2')" class="text-xs font-bold text-indigo-600">Copy Body</button></div>
                            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 min-h-[200px]"><p id="msg2" class="text-sm text-slate-600 leading-relaxed italic">---</p></div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Panel -->
            <section class="lg:col-span-3 space-y-6">
                <div class="glass-panel p-8 text-center bg-white border-b-4 border-indigo-600 shadow-xl">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Humanity Score</h3>
                    <div id="humanityGauge" class="score-circle">
                        <div>
                            <span id="scoreVal" class="text-4xl font-extrabold text-slate-900 leading-none">0</span>
                            <span class="block text-[10px] font-bold text-slate-400 uppercase mt-1">/ 100</span>
                        </div>
                    </div>
                    <p id="scoreLabel" class="text-xs font-bold mt-6 text-slate-400 uppercase tracking-wider">Audit Needed</p>
                </div>
                <div class="glass-panel p-6 text-center">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Spam Risk Audit</h3>
                    <div class="chart-container"><canvas id="spamChart"></canvas></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('c2c_auth_key') || "";
        let spamChart;
        window.onload = () => { initCharts(); updateStatus(); };
        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function saveApiKey() { apiKey = document.getElementById('apiKeyInput').value; localStorage.setItem('c2c_auth_key', apiKey); updateStatus(); toggleSettings(); }
        function updateStatus() { const d = document.getElementById('apiStatusDot'); const t = document.getElementById('apiStatusText'); d.className = apiKey ? "w-2 h-2 rounded-full bg-emerald-500" : "w-2 h-2 rounded-full bg-slate-300"; t.innerText = apiKey ? "AI Engine: Ready" : "AI: Offline"; }
        const banks = { 
            subs: [(r)=>`Quick check: ${r} role`, (r)=>`C2C for ${r}?`, (r)=>`Question re: ${r}`],
            feeler: (n,r)=>`Hi ${n},\n\nI noticed you're looking for a ${r}. Are you currently entertaining C2C submissions for this opening?\n\nIf so, I have a strong consultant I can share details on. Please let me know if you're open to it.\n\nBest,\n[Your Name]`,
            pitch: (n,r,s)=>`Thanks ${n}.\n\nAs discussed, here is the resume for our consultant. They have over 10 years experience in ${s} and are available immediately for C2C projects.\n\nLmk if you want to chat!`
        };
        function initCharts() { const ctx = document.getElementById('spamChart').getContext('2d'); spamChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Safe', 'Risk'], datasets: [{ data: [100, 0], backgroundColor: ['#e2e8f0', '#f1f5f9'], borderWidth: 0 }] }, options: { cutout: '80%', circumference: 180, rotation: 270, plugins: { legend: { display: false } } } }); }
        function predictEmails() {
            const f = document.getElementById('firstName').value.trim().toLowerCase();
            const l = document.getElementById('lastName').value.trim().toLowerCase();
            const d = document.getElementById('domain').value.trim().toLowerCase();
            if(!f || !l || !d) return;
            const res = document.getElementById('emailResults'); res.classList.remove('hidden'); res.innerHTML = `<p class="text-[10px] font-bold text-indigo-600 mb-2">PREDICTIONS</p>`;
            [`${f}.${l}@${d}`, `${f.charAt(0)}${l}@${d}`, `${f}@${d}`].forEach(e => {
                res.innerHTML += `<div class="flex justify-between items-center bg-white p-2 rounded-lg border mb-1 shadow-sm text-[10px] font-mono"><span>${e}</span><button onclick="copy('${e}')" class="text-indigo-600 font-bold">COPY</button></div>`;
            });
        }
        async function auditDomain() {
            const d = document.getElementById('domain').value; if(!d || !apiKey) return alert("Add API key first.");
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: `Email pattern for ${d}` }] }] }) });
                const dat = await r.json(); alert(dat.candidates[0].content.parts[0].text);
            } catch (e) { alert("API Error."); }
        }
        function generate() {
            const r = document.getElementById('roleInput').value || "the role";
            const n = document.getElementById('firstName').value || "there";
            const s = document.getElementById('stackInput').value || "tech";
            const sub = banks.subs[Math.floor(Math.random()*3)](r);
            const m1 = banks.feeler(n,r);
            document.getElementById('sub1').value = sub;
            document.getElementById('msg1').innerText = m1;
            document.getElementById('msg2').innerText = banks.pitch(n,r,s);
            analyze(sub, m1);
        }
        async function humanize() {
            const cur = document.getElementById('msg1').innerText; if(!apiKey || cur.includes("Generating")) return alert("Add API Key and Generate Draft.");
            document.getElementById('aiLoad').classList.remove('hidden');
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: `Rewrite this C2C inquiry to be more human. Max 2 sentences. No bot cliches. Text: ${cur}` }] }] }) });
                const dat = await r.json(); const txt = dat.candidates[0].content.parts[0].text.trim();
                document.getElementById('msg1').innerText = txt; analyze(document.getElementById('sub1').value, txt);
            } catch (e) { alert("AI Error."); }
            document.getElementById('aiLoad').classList.add('hidden');
        }
        function analyze(s, m) {
            const c = (s + m).toLowerCase();
            let score = 60; if (m.length < 250) score += 20; if (c.includes("?")) score += 20; if (c.includes("hope this email finds you well")) score -= 40;
            score = Math.min(Math.max(score, 10), 98);
            document.getElementById('scoreVal').innerText = Math.round(score);
            document.getElementById('humanityGauge').style.background = `radial-gradient(closest-side, white 80%, transparent 81% 100%), conic-gradient(#6366f1 ${score}%, #e2e8f0 0)`;
            document.getElementById('scoreLabel').innerText = score > 80 ? "HUMAN AUTHENTIC" : "BOT PATTERN DETECTED";
            document.getElementById('scoreLabel').className = `text-xs font-bold mt-6 tracking-wider ${score > 80 ? 'text-emerald-500' : 'text-red-500'}`;
            let risk = 10; if (c.includes("urgent")) risk += 30; if (m.length > 500) risk += 20;
            spamChart.data.datasets[0].data = [100 - risk, risk]; 
            spamChart.data.datasets[0].backgroundColor = [risk > 30 ? '#f87171' : '#6366f1', '#f1f5f9'];
            spamChart.update();
        }
        function tab(t) { document.getElementById('step1View').classList.toggle('hidden', t === 'step2'); document.getElementById('step2View').classList.toggle('hidden', t === 'step1'); document.getElementById('t1').classList.toggle('tab-active', t === 'step1'); document.getElementById('t2').classList.toggle('tab-active', t === 'step2'); }
        function copy(i) { const v = document.getElementById(i)?.innerText || document.getElementById(i)?.value || i; navigator.clipboard.writeText(v); }
    </script>
</body>
</html>
